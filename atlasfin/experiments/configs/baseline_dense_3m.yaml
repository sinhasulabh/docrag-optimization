name: baseline_dense_3m
ingest_run_uri: gs://atlasfin-raw-dev/run=20260801t000036z/
doc_names:
  - 3M_2015_10K
  - 3M_2016_10K
  - 3M_2017_10K
  - 3M_2018_10K
  - 3M_2019_10K
  - 3M_2020_10K
  - 3M_2021_10K
  - 3M_2022_10K
gold_set_path: financebench_open_source.jsonl

parsing:
  backend: docling
  ocr: auto
  table_mode: structured
  keep_images: false

chunking:
  strategy: structure_aware
  max_tokens: 512
  overlap_tokens: 64
  contextual_prefix: false
  metadata_fields: [section, pages, doc_type, doc_period, company]

embedding:
  model_id: voyage-finance-2
  dimension: null  # voyage-finance-2's output_dimension truncation support is unverified
  normalize: true
  batch_size: 64

retrieval:
  mode: dense
  fusion: rrf
  top_k: 20
  filters_enabled: false
  parent_child: false
  query_transform: none
  # index_type: flat -- exact search, cheap & fully deterministic at this small (8-doc) scale
  index_type: flat
  ann_search_param: 10

reranking:
  enabled: false
  depth: 20
